spring.h2.console.enabled=true
spring.h2.console.path=/h2

# H2 DB connection
spring.datasource.url=jdbc:h2:mem:mydb
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driverClassName=org.h2.Driver

# JPA and Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.connection.pool_size=50

# src/test/resources/application-test.properties
security.secret-key=01234567890123456789012345678901
security.access-token-minutes=5
security.refresh-token-minutes=30

# Embedded Mongo para tests (sin dependencia de Docker/cluster local)
de.flapdoodle.mongodb.embedded.version=7.0.14
